{% extends "base.html" %} {% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-md p-8">
    <h1 class="text-2xl font-bold text-gray-800 text-center mb-6">Login</h1>
    <form action="{% url 'login' %}" method="POST" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
      <div>
        <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
        <input
          type="{{ field.field.widget.input_type }}"
          name="{{ field.name }}"
          id="{{ field.id_for_label }}"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent"
          {% if field.value %}value="{{ field.value }}"{% endif %}
          {% if field.field.required %}required{% endif %}
        />
        {% if field.errors %}
        <p class="text-red-500 text-sm mt-1">{{ field.errors.0 }}</p>
        {% endif %}
      </div>
      {% endfor %}
      <button
        type="submit"
        class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-200 cursor-pointer"
      >
        Login
      </button>
    </form>
  </div>
</div>
{% endblock content %}
