{% extends "base.html" %} {% block content %}
<div class="max-w-7xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-gray-800 mb-8">Product List</h1>
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    {% for product in products %}
    <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300">
      {% if product.photo %}
      <img
        src="{{ product.photo.url }}"
        alt="{{ product.name }}"
        class="w-full h-48 object-cover"
      />
      {% else %}
      <div class="w-full h-48 bg-gray-200 flex items-center justify-center text-gray-400">
        No image
      </div>
      {% endif %}
      <div class="p-4">
        <h2 class="text-lg font-semibold text-gray-800">{{ product.name }}</h2>
        <p class="text-xl font-bold text-amber-600 mt-2">${{ product.price }}</p>
        <form method="POST" action="{% url 'add_product' %}" class="mt-4">
          {% csrf_token %}
          <input type="hidden" name="product" value="{{ product.id }}">
          <button type="submit" class="w-full bg-amber-600 text-white py-2 px-4 rounded-lg hover:bg-amber-700 transition-colors duration-200">
            Add to Order
          </button>
        </form>
      </div>
    </div>
    {% empty %}
    <p class="col-span-full text-center text-gray-500 py-12">No products available.</p>
    {% endfor %}
  </div>
</div>
{% endblock content %}
